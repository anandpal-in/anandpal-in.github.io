<nav class="nav-container" aria-label="Main">

    <div class="nav-content">

        <a href="{{ '/' | relative_url }}" class="logo">
            Dr. Anand Pal
        </a>

        <button class="mobile-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-menu">
            <span></span><span></span><span></span>
        </button>

        {% comment %} Menu items and their order come from _data/navigation.yml. {% endcomment %}
        <ul class="nav-menu" id="nav-menu">
            {% for item in site.data.navigation %}
            <li>
                <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
            </li>
            {% endfor %}
        </ul>

    </div>

</nav>
